<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Blazor progress repro</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 780px; margin: 3rem auto; padding: 0 1rem; }
    .loading-progress { width: 100%; height: 1.25rem; }
    .loading-progress-text::after { content: var(--blazor-load-percentage-text, "Loading..."); }
    #trace { font: 12px ui-monospace, monospace; max-height: 15rem; overflow: auto; white-space: pre-wrap; }
    .regression { color: #b00020; font-weight: bold; }
  </style>
</head>
<body>
  <div id="app">
    <h1>Loading Blazor WebAssembly</h1>
    <progress class="loading-progress" max="100"></progress>
    <p class="loading-progress-text" aria-live="polite"></p>
    <p id="regressions">Decreases: 0</p>
    <pre id="trace"></pre>
  </div>
  <script>
    (() => {
      const root = document.documentElement;
      const trace = document.getElementById('trace');
      const regressions = document.getElementById('regressions');
      const bar = document.querySelector('progress');
      const entries = [];
      let previous = null;
      let decreases = 0;
      const record = () => {
        const raw = root.style.getPropertyValue('--blazor-load-percentage').trim();
        const current = Number.parseFloat(raw);
        if (!Number.isFinite(current) || current === previous) return;
        const decreased = previous !== null && current < previous;
        const entry = { timeMs: Math.round(performance.now()), previous, current, decreased };
        entries.push(entry);
        sessionStorage.setItem('blazor-progress-repro', JSON.stringify(entries));
        trace.textContent += `${entry.timeMs} ms: ${previous ?? 'start'}% -> ${current}%${decreased ? ' DECREASED' : ''}\n`;
        trace.scrollTop = trace.scrollHeight;
        bar.value = Math.min(100, Math.max(0, current));
        if (decreased) {
          decreases++;
          regressions.textContent = `Decreases: ${decreases}`;
          regressions.className = 'regression';
          console.error('PROGRESS DECREASED', entry);
        } else {
          console.log('Blazor progress', entry);
        }
        previous = current;
      };
      new MutationObserver(record).observe(root, { attributes: true, attributeFilter: ['style'] });
      record();
    })();
  </script>
  <script src="_framework/blazor.webassembly.js" autostart="false"></script>
  <script>
    Blazor.start({ applicationCulture: 'en-US' });
  </script>
</body>
</html>
